# Builds the API and web images and pushes them to Docker Hub:
#   abhinav2911/mail-rocket-api   (apps/api/Dockerfile)
#   abhinav2911/mail-rocket-web   (apps/web/Dockerfile)
#
# Release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# which publishes 0.1.0, 0.1 and latest for both images, for linux/amd64 and
# linux/arm64 (Graviton, Apple Silicon). "Run workflow" in the Actions tab
# rebuilds an existing tag the same way.
#
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# personal access token with Read & Write access).
name: Publish images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time per ref; a second push of the same tag waits.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One image failing shouldn't cancel the other mid-push.
      fail-fast: false
      matrix:
        include:
          - name: api
            image: abhinav2911/mail-rocket-api
            dockerfile: apps/api/Dockerfile
          - name: web
            image: abhinav2911/mail-rocket-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Emulates arm64 so one runner can build both platforms.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2 and latest. Run by hand from a branch, it tags
      # the branch name instead (e.g. main), never latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Both Dockerfiles build from the repo root (the Bun workspace).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub Actions, kept apart per image.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
